# Railway deployment manifest for Paradox MMO (Kaetram-Open fork)
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /app/docker-entrypoint.sh materialises Railway env vars -> .env and then
# execs the server. Kaetram's dotenv-extended doesn't read process.env directly.
startCommand = "/app/docker-entrypoint.sh"
# uWS returns 200 OK for GET / when serving the client index.html → healthcheck passes
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
