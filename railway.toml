# Railway deployment manifest for Paradox MMO (Kaetram-Open fork)
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run the server directly. Kaetram's dotenv-extended is patched in
# packages/common/config.ts (includeProcessEnv: true) so Railway-injected
# env vars reach the Config object at runtime.
# cd into /app/packages/server so config.ts's `../../.env.defaults` path
# resolves to /app/.env.defaults (matches the monorepo dev layout).
startCommand = "cd /app/packages/server && node --enable-source-maps dist/main.js"

# uWS's httpResponse handler serves /app/client-dist/index.html on GET /
# → Railway's HTTP healthcheck will see 200 OK once the server is up.
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
