nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.0.0-rc.40.cjs

# Force resolution of platform-specific optional deps (e.g. sharp-linux-x64)
# so native modules install correctly inside the Railway Docker image.
supportedArchitectures:
  os:
    - linux
    - "current"
  cpu:
    - x64
    - "current"
  libc:
    - glibc
    - "current"
